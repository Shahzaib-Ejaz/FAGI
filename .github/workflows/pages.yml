name: dashboard-pages

# Publishes the results dashboard as a web page. The page is rebuilt from
# experiments/results/paper_results.json on every push to main, so it always matches the results
# in the repository, even if dashboard.html itself was not regenerated and committed.
on:
  push:
    branches: [main]
    paths:
      - "experiments/results/**"
      - "scripts/build_dashboard.py"
      - "scripts/dashboard_template.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the dashboard from the results
        run: |
          python scripts/build_dashboard.py
          mkdir -p _site
          cp dashboard.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
