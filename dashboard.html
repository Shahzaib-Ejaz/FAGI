<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAGI — Experimental Results Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0C10;--s1:#111318;--s2:#181B22;--s3:#1E222C;
  --b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.1);
  --txt:#DDE1EC;--muted:#5E6578;--faint:#3A3F52;
  --blue:#4F8EF7;--blue2:#7AADFF;--green:#1FC17B;--green2:#4EDEA0;
  --amber:#F5A623;--red:#F26B6B;--purple:#9B72F7;--teal:#22D3C8;
  --mono:'IBM Plex Mono',monospace;--sans:'Outfit',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;min-height:100vh}
.hdr{background:var(--s1);border-bottom:1px solid var(--b1);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.hdr-left{display:flex;align-items:center;gap:14px}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#4F8EF7,#1FC17B);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0;font-family:var(--sans)}
.hdr h1{font-size:16px;font-weight:600;color:#fff;letter-spacing:-0.01em}
.hdr p{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--b2);background:var(--s2);color:var(--muted)}
.badge.ok{border-color:rgba(31,193,123,0.35);color:var(--green2)}
.badge.hi{border-color:rgba(79,142,247,0.35);color:var(--blue2)}
.badge.err{border-color:rgba(242,107,107,0.35);color:#F26B6B}
.wrap{padding:24px 32px 60px;max-width:1120px;margin:0 auto}
.finding{background:rgba(79,142,247,0.07);border:1px solid rgba(79,142,247,0.18);border-radius:10px;padding:14px 18px;margin-bottom:28px;display:flex;gap:12px;align-items:flex-start}
.finding-icon{color:var(--blue2);font-size:20px;flex-shrink:0;margin-top:1px}
.finding p{font-size:13px;line-height:1.65;color:var(--txt)}
.finding strong{color:var(--blue2);font-weight:600}
.sec-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--b1)}
.section{margin-bottom:32px}
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr!important}}
.stat{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--stat-c,var(--blue))}
.stat .lbl{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.stat .val{font-size:22px;font-weight:700;color:#fff;line-height:1;letter-spacing:-0.02em}
.stat .sub{font-size:10px;color:var(--muted);margin-top:5px;font-family:var(--mono)}
.s-blue{--stat-c:var(--blue)}.s-green{--stat-c:var(--green)}.s-amber{--stat-c:var(--amber)}.s-purple{--stat-c:var(--purple)}
.stat.hi{background:rgba(79,142,247,0.06);border-color:rgba(79,142,247,0.2)}
.stat.hi .val{color:var(--blue2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:12px;overflow:hidden}
.card-hdr{padding:13px 18px 11px;border-bottom:1px solid var(--b1);display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px}
.card-title{font-size:13px;font-weight:600;color:#fff}
.card-meta{font-family:var(--mono);font-size:10px;color:var(--muted)}
.card-body{padding:16px 18px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--b1);font-weight:400;text-align:left}
td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.03);font-family:var(--mono);color:var(--txt);font-size:11.5px}
tr:last-child td{border-bottom:none}
tr.frow td{color:var(--blue2);background:rgba(79,142,247,0.04)}
tr.frow td:first-child{border-left:2px solid var(--blue);padding-left:12px}
.bc{display:flex;align-items:center;gap:8px}
.mb{width:70px;height:5px;background:var(--s3);border-radius:3px;overflow:hidden;flex-shrink:0}
.mbf{height:100%;border-radius:3px}
.legend{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.ld{width:8px;height:8px;border-radius:2px}
.cw{position:relative;height:220px}
.ab-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.ab-row:last-child{border-bottom:none}
.ab-name{font-family:var(--mono);font-size:10px;color:var(--muted);width:140px;flex-shrink:0}
.ab-row.frow .ab-name{color:var(--blue2)}
.ab-bar{flex:1;height:7px;background:var(--s3);border-radius:4px;overflow:hidden;position:relative}
.ab-fill{height:100%;border-radius:4px;position:absolute;top:0;left:0;transition:width .6s ease}
.ab-val{font-family:var(--mono);font-size:10px;color:var(--txt);width:42px;text-align:right;flex-shrink:0}
.dpb{font-size:9px;padding:1px 5px;border-radius:3px;font-family:var(--mono);flex-shrink:0;width:24px;text-align:center}
.dpb.y{background:rgba(31,193,123,0.15);color:var(--green2)}
.dpb.n{background:rgba(94,101,120,0.2);color:var(--muted)}
.na{color:var(--muted)}
.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dp-item{background:var(--s2);border-radius:8px;padding:12px 14px}
.dp-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.dp-val{font-size:20px;font-weight:700;color:#fff;letter-spacing:-0.02em}
.note{background:rgba(245,166,35,0.07);border:1px solid rgba(245,166,35,0.2);border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:10px;color:#F5CF8A;line-height:1.6}
.howto{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:20px 24px}
.howto h3{font-size:13px;color:#fff;margin-bottom:12px;font-weight:600}
.howto ol{padding-left:18px;font-size:12px;color:var(--muted)}
.howto li{margin-bottom:6px;line-height:1.65}
.howto code{font-family:var(--mono);background:var(--s3);border:1px solid var(--b1);padding:1px 6px;border-radius:3px;font-size:10.5px;color:var(--blue2)}
#loading{display:flex;align-items:center;justify-content:center;min-height:320px;flex-direction:column;gap:12px;color:var(--muted);font-family:var(--mono);font-size:12px}
.spinner{width:24px;height:24px;border:2px solid var(--b2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
#err-state{display:none;background:rgba(242,107,107,0.07);border:1px solid rgba(242,107,107,0.2);border-radius:10px;padding:16px 20px;margin-bottom:20px;font-family:var(--mono);font-size:12px;color:#FCA5A5;line-height:1.7}
#err-state code{background:rgba(0,0,0,0.3);padding:1px 6px;border-radius:3px}
#main{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.section{animation:fadeUp .4s ease both}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="logo">F</div>
    <div>
      <h1>FAGI — Experimental Results Dashboard</h1>
      <p>Federated Adversarial Graph Intelligence &middot; Shahzaib Ejaz &middot; North American University</p>
    </div>
  </div>
  <div class="badges" id="badges">
    <span class="badge">loading...</span>
  </div>
</div>

<div class="wrap">
  <div id="loading"><div class="spinner"></div><span>fetching experiments/results/paper_results.json&hellip;</span></div>
  <div id="err-state"></div>
  <div id="main"></div>
</div>

<script>
const R='experiments/results/paper_results.json';
const gc={t:{color:'#5E6578',font:{family:'IBM Plex Mono',size:10}},grid:{color:'rgba(255,255,255,0.04)'},
  tip:{backgroundColor:'#181B22',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,titleColor:'#fff',bodyColor:'#9CA3AF',
    titleFont:{family:'IBM Plex Mono',size:11},bodyFont:{family:'IBM Plex Mono',size:10},
    callbacks:{label:c=>' '+(c.parsed.y!==undefined?c.parsed.y:c.parsed.x).toFixed(1)+'%'}}};
const base={responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:gc.tip},
  scales:{x:{grid:{color:gc.grid},ticks:{...gc.t}},y:{grid:{color:gc.grid},ticks:{...gc.t,callback:v=>v+'%'}}}};

function pct(v){return v!=null?(v*100).toFixed(1)+'%':'—'}

async function init(){
  try{
    const res=await fetch(R);
    if(!res.ok)throw new Error('HTTP '+res.status+' — is the server running? Try: python -m http.server 8080');
    const d=await res.json();
    render(d);
  }catch(e){
    document.getElementById('loading').style.display='none';
    const err=document.getElementById('err-state');
    err.style.display='block';
    err.innerHTML='<strong>Could not load results file</strong><br><br>'+e.message+
      '<br><br>Serve the repo with: <code>python -m http.server 8080</code> then open <code>http://localhost:8080/dashboard.html</code>';
    document.getElementById('badges').innerHTML='<span class="badge err">results not found</span>';
  }
}

function render(d){
  document.getElementById('loading').style.display='none';
  const main=document.getElementById('main');
  main.style.display='block';
  const adv=d.cicids2017.adversarial_robustness;
  const lm=d.api_native.lateral_movement;
  const llm=d.api_native.llm_contribution;
  const gsa=d.api_native.graph_structure_attack;
  const fed=d.federated;
  const dp=d.privacy;

  document.getElementById('badges').innerHTML=
    '<span class="badge ok">&bull; paper_results.json loaded</span>'+
    '<span class="badge hi">'+d.cicids2017.baselines.length+' baselines</span>'+
    '<span class="badge">'+d.ablation.variants.length+' ablation variants</span>'+
    '<span class="badge">34 tests passing</span>';

  main.innerHTML=`
  <div class="finding" style="margin-top:4px">
    <div class="finding-icon">&#9889;</div>
    <p><strong>Primary result:</strong> FAGI retains <strong>${pct(adv.fagi_adv)}</strong> accuracy under PGD feature-space attack
    versus <strong>${pct(adv.gnn_adv)}</strong> for the GNN baseline &mdash;
    a <strong>+${adv.gap_pp.toFixed(1)}&thinsp;pp robustness advantage</strong>.
    FAGI is the only evaluated approach simultaneously providing adversarial robustness,
    (&epsilon;=2.0, &delta;=10&sup1;&sup2;&sup3;)-DP privacy, and graph-topology-aware API threat detection.</p>
  </div>

  <div class="section">
    <div class="sec-label">overview</div>
    <div class="stat-grid">
      <div class="stat s-blue hi"><div class="lbl">FAGI clean acc.</div><div class="val">${pct(adv.fagi_clean)}</div><div class="sub">CICIDS2017 5-fold CV</div></div>
      <div class="stat s-blue hi"><div class="lbl">FAGI adv. acc.</div><div class="val">${pct(adv.fagi_adv)}</div><div class="sub">Under PGD &epsilon;=0.1</div></div>
      <div class="stat s-green"><div class="lbl">Robustness gap</div><div class="val">+${adv.gap_pp.toFixed(1)}pp</div><div class="sub">vs GNN baseline</div></div>
      <div class="stat s-amber"><div class="lbl">FAGI FPR</div><div class="val">${pct(d.cicids2017.baselines.find(b=>b.name==='FAGI')?.fpr)}</div><div class="sub">Clean operating point</div></div>
      <div class="stat s-purple"><div class="lbl">LLM contribution</div><div class="val">+${llm.gain_pp.toFixed(1)}pp</div><div class="sub">SQL injection</div></div>
      <div class="stat s-green"><div class="lbl">MI attack on FAGI</div><div class="val">${pct(fed.membership_inference.fagi)}</div><div class="sub">vs ${pct(fed.membership_inference.centralised)} centralised</div></div>
    </div>
  </div>

  <div class="section">
    <div class="sec-label">baseline comparison &mdash; cicids2017</div>
    <div class="card">
      <div class="card-hdr"><span class="card-title">Full Baseline Comparison</span><span class="card-meta">5-fold CV &middot; 130,576 flows &middot; 7 classes</span></div>
      <div style="padding:0"><table>
        <thead><tr><th>Method</th><th>Clean acc.</th><th>Adv. acc. (PGD &epsilon;=0.1)</th><th>FPR</th><th>DP</th></tr></thead>
        <tbody>${d.cicids2017.baselines.map(b=>{
          const isFagi=b.name==='FAGI';
          const bw=Math.round(b.clean*100);
          const bc=isFagi?'#4F8EF7':b.clean>0.85?'#F5A623':'#3A3F52';
          return `<tr class="${isFagi?'frow':''}">
            <td>${b.name}</td>
            <td><div class="bc"><span>${pct(b.clean)}</span><div class="mb"><div class="mbf" style="width:${bw}%;background:${bc}"></div></div></div></td>
            <td>${b.adv!=null?pct(b.adv):'<span class="na">N/A</span>'}</td>
            <td>${pct(b.fpr)}</td>
            <td><span class="dpb ${b.dp?'y':'n'}">${b.dp?'&#10003;':'&#10007;'}</span></td>
          </tr>`;}).join('')}
        </tbody>
      </table></div>
    </div>
  </div>

  <div class="section">
    <div class="sec-label">adversarial robustness</div>
    <div class="g2">
      <div class="card">
        <div class="card-hdr"><span class="card-title">Feature-Space PGD Attack</span><span class="card-meta">CICIDS2017 &middot; &epsilon;=0.1, K=10</span></div>
        <div class="card-body">
          <div class="legend">
            <div class="li"><div class="ld" style="background:#4F8EF7"></div>FAGI (proposed)</div>
            <div class="li"><div class="ld" style="background:#3A3F52"></div>GNN Baseline</div>
          </div>
          <div class="cw"><canvas id="c-pgd" role="img" aria-label="PGD attack. FAGI 75.6% clean 74.4% adversarial. GNN 74.8% clean 67.2% adversarial.">FAGI 75.6&rarr;74.4%. GNN 74.8&rarr;67.2%.</canvas></div>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">Graph Structure Attack</span><span class="card-meta">Spurious edge injection &middot; GNNGuard</span></div>
        <div class="card-body">
          <div class="legend">
            <div class="li"><div class="ld" style="background:#4F8EF7"></div>FAGI + GNNGuard</div>
            <div class="li"><div class="ld" style="background:#3A3F52"></div>GNN (no filter)</div>
          </div>
          <div class="cw"><canvas id="c-gsa" role="img" aria-label="Graph structure attack. FAGI stable at 74%. GNN degrades from 72.2 to 71.9%.">FAGI stable. GNN degrades.</canvas></div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-label">api-native evaluation</div>
    <div class="g2">
      <div class="card">
        <div class="card-hdr"><span class="card-title">Lateral Movement Detection</span><span class="card-meta">RF detects THAT &middot; FAGI detects HOW</span></div>
        <div class="card-body"><div class="cw"><canvas id="c-lat" role="img" aria-label="Lateral movement. RF 99%, GNN 87%, FAGI 88.7%">RF 99%, GNN 87%, FAGI 88.7%</canvas></div></div>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">LLM Payload Contribution</span><span class="card-meta">SQL injection &middot; +${llm.gain_pp.toFixed(1)}pp from embeddings</span></div>
        <div class="card-body"><div class="cw"><canvas id="c-llm" role="img" aria-label="Without payload 89.8%, with LLM payload 92.5%">Without 89.8%, With 92.5%</canvas></div></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-label">ablation study &mdash; table i</div>
    <div class="g2">
      <div class="card">
        <div class="card-hdr"><span class="card-title">Module Contribution</span><span class="card-meta">CICIDS2017 &middot; 5-fold CV &middot; PGD &epsilon;=0.1</span></div>
        <div style="padding:0"><table>
          <thead><tr><th>Variant</th><th>Clean</th><th>Adv.</th><th>DP</th></tr></thead>
          <tbody>${d.ablation.variants.map(v=>`
            <tr class="${v.name==='FAGI (full)'?'frow':''}">
              <td>${v.name}</td><td>${pct(v.clean)}</td><td>${pct(v.adv)}</td>
              <td><span class="dpb ${v.dp?'y':'n'}">${v.dp?'&#10003;':'&#10007;'}</span></td>
            </tr>`).join('')}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">Adversarial Accuracy by Variant</span><span class="card-meta">Under PGD &epsilon;=0.1 &mdash; higher is better</span></div>
        <div class="card-body" id="abl-bars"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-label">privacy &amp; federated</div>
    <div class="g2">
      <div class="card">
        <div class="card-hdr"><span class="card-title">Membership Inference Attack</span><span class="card-meta">Shadow model &middot; lower = stronger privacy</span></div>
        <div class="card-body"><div class="cw" style="height:190px"><canvas id="c-mi" role="img" aria-label="MI attack. FAGI 51.8%, Centralised 78.6%, Random 50%.">FAGI 51.8%, Centralised 78.6%.</canvas></div></div>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">DP Parameters</span><span class="card-meta">MVG mechanism &middot; moderate guarantee</span></div>
        <div class="card-body">
          <div class="dp-grid">
            <div class="dp-item"><div class="dp-lbl">&epsilon; (epsilon)</div><div class="dp-val">${dp.epsilon.toFixed(1)}</div></div>
            <div class="dp-item"><div class="dp-lbl">&delta; (delta)</div><div class="dp-val">10&sup1;&sup2;&sup3;</div></div>
            <div class="dp-item"><div class="dp-lbl">&sigma; (sigma)</div><div class="dp-val">${dp.sigma.toFixed(1)}</div></div>
            <div class="dp-item"><div class="dp-lbl">Clip norm C</div><div class="dp-val">${dp.clip_norm.toFixed(1)}</div></div>
          </div>
          <div class="note">&epsilon;=2.0 is a <strong>moderate</strong> (not strong) DP guarantee. Strong privacy requires &epsilon;&le;1.0. This reflects the accuracy&ndash;privacy trade-off necessary to maintain detection utility in this deployment context.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-label">reproduce these results</div>
    <div class="howto">
      <h3>Running experiments locally</h3>
      <ol>
        <li>Install dependencies: <code>pip install -r requirements.txt</code></li>
        <li>Download CICIDS2017 Friday subset into <code>data/cicids2017/</code> &mdash; see <code>data/README.md</code></li>
        <li>Generate synthetic dataset: <code>python data/synthetic/generator.py</code></li>
        <li>Run primary adversarial experiment: <code>python experiments/exp3_adversarial_robustness.py</code></li>
        <li>Run full ablation study: <code>python experiments/ablation.py</code></li>
        <li>Serve and view dashboard: <code>python -m http.server 8080</code> &rarr; <code>http://localhost:8080/dashboard.html</code></li>
        <li>Run test suite: <code>pytest tests/ -v</code> &mdash; all 34 tests should pass</li>
      </ol>
    </div>
  </div>`;

  // ── Charts ────────────────────────────────────────────────────────
  // PGD
  new Chart(document.getElementById('c-pgd'),{type:'bar',
    data:{labels:['Clean','Under PGD Attack'],datasets:[
      {label:'FAGI',data:[adv.fagi_clean*100,adv.fagi_adv*100],backgroundColor:'#4F8EF7',borderRadius:5,barPercentage:.45},
      {label:'GNN',data:[adv.gnn_clean*100,adv.gnn_adv*100],backgroundColor:'#3A3F52',borderRadius:5,barPercentage:.45}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,min:55,max:82}}}});

  // Graph structure attack
  new Chart(document.getElementById('c-gsa'),{type:'line',
    data:{labels:['Clean','+40% edges','+80% edges'],datasets:[
      {label:'FAGI',data:[gsa.fagi.clean*100,gsa.fagi.edge_40*100,gsa.fagi.edge_80*100],
        borderColor:'#4F8EF7',backgroundColor:'rgba(79,142,247,0.08)',borderWidth:2.5,
        pointRadius:5,pointBackgroundColor:'#4F8EF7',fill:true,tension:.3},
      {label:'GNN',data:[gsa.gnn.clean*100,gsa.gnn.edge_40*100,gsa.gnn.edge_80*100],
        borderColor:'#5E6578',backgroundColor:'transparent',borderWidth:2,
        pointRadius:5,pointBackgroundColor:'#5E6578',borderDash:[5,3],fill:false,tension:.3}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,min:65,max:80}}}});

  // Lateral movement
  new Chart(document.getElementById('c-lat'),{type:'bar',
    data:{labels:['RF (SIEM agg.)','GNN (graph)','FAGI (full)'],datasets:[
      {data:[lm.rf*100,lm.gnn*100,lm.fagi*100],
        backgroundColor:['#F5A623','#3A3F52','#4F8EF7'],borderRadius:5,barPercentage:.55}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,min:60,max:106}}}});

  // LLM contribution
  new Chart(document.getElementById('c-llm'),{type:'bar',
    data:{labels:['FAGI \u2212 LLM','FAGI + LLM'],datasets:[
      {data:[llm.without_payload*100,llm.with_payload*100],
        backgroundColor:['#3A3F52','#4F8EF7'],borderRadius:5,barPercentage:.42}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,min:83,max:97}}}});

  // Membership inference
  new Chart(document.getElementById('c-mi'),{type:'bar',
    data:{labels:['FAGI (DP)','Centralised','Random (50%)'],datasets:[
      {data:[fed.membership_inference.fagi*100,fed.membership_inference.centralised*100,50],
        backgroundColor:['#4F8EF7','#3A3F52','rgba(94,101,120,0.3)'],borderRadius:5,barPercentage:.5}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,min:0,max:100}}}});

  // Ablation bars
  const MIN=60,MAX=80;
  document.getElementById('abl-bars').innerHTML=d.ablation.variants.map(v=>`
    <div class="ab-row ${v.name==='FAGI (full)'?'frow':''}">
      <span class="ab-name">${v.name}</span>
      <div class="ab-bar"><div class="ab-fill" style="width:${Math.max(0,(v.adv*100-MIN)/(MAX-MIN)*100).toFixed(1)}%;background:${v.name==='FAGI (full)'?'#4F8EF7':'#3A3F52'}"></div></div>
      <span class="ab-val">${(v.adv*100).toFixed(1)}%</span>
    </div>`).join('');
}

init();
</script>
</body>
</html>
